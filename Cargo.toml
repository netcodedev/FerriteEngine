[workspace]
members = [
    "crates/engine",
    "crates/engine-macros",
    "crates/engine-ui",
    "crates/editor",
    "crates/sandbox",
    "crates/scripts",
]
# Only ever built as a dependency: cargo builds a dylib dependency with
# `-C prefer-dynamic`, a workspace root without. Both would be written to the
# same unhashed library file, and the variant with a static std cannot be
# linked against.
exclude = ["crates/engine-dylib"]
resolver = "2"

[profile.dev]
opt-level = 3
