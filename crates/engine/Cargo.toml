[package]
name = "ferrite"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
as-any = "0.3.2"
bincode = "1"
cgmath = "0.18.0"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11.11"
fast-surface-nets = "0.2.1"
ferrite_macros = { path = "../engine-macros" }
gl = "0.14.0"
glfw = "0.63.0"
image = "0.25.10"
lazy_static = "1.5.1"
libloading = "0.8"
libnoise = "1.2.0"
log = "0.4.35"
ndarray = "0.17.2"
rand = "0.10.3"
rapier3d = { version = "0.36.1", features = ["parallel"] }
renet = "1"
renet_netcode = "1"
ron = "0.12.3"
russimp-ng = { version = "3.2.7" }
rusttype = { version = "0.9.3", features = ["gpu_cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[features]
# Assimp and GLFW built from source and linked in, instead of the
# system's shared libraries: for exported games, which must run where
# those are not installed.
standalone = ["russimp-ng/static-link", "glfw/src-build"]
