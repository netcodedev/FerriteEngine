[package]
name = "ferrite"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
mint = "0.5"
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis", "flac", "mp3"] }
as-any = "0.3.2"
bincode = "1"
cgmath = "0.18.0"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11.11"
fast-surface-nets = "0.2.1"
ferrite_macros = { path = "../engine-macros" }
gl = "0.14.0"
glfw = "0.63.0"
ash = { version = "0.38", optional = true }
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"], optional = true }
shaderc = { version = "0.10", optional = true }
image = "0.25.10"
lazy_static = "1.5.1"
libloading = "0.9"
libnoise = "1.2.0"
log = "0.4.35"
ndarray = "0.17.2"
rand = "0.10.3"
rapier3d = { version = "0.36.1", features = ["parallel"] }
renet = "2"
renet_netcode = "2"
ron = "0.12.3"
russimp-ng = { version = "3.2.7" }
rusttype = { version = "0.9.3", features = ["gpu_cache"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23"
# BC7 decoded on the CPU, for code that works on the pixels of a packed
# image (docs/asset-pack.md).
bcdec_rs = "0.2"
# BC7 encoding when cooking an asset pack: the editor only.
intel_tex_2 = { version = "0.5", optional = true }
trash = "5"

[features]
# The Vulkan backend (see docs/render-backends.md). On by default (editor,
# development builds) and in exported games.
default = ["vulkan", "cook"]
# Cooking assets into a pack for an export (docs/asset-pack.md): the
# editor; exported games only read packs.
cook = ["dep:intel_tex_2"]
vulkan = ["dep:ash", "dep:gpu-allocator", "dep:shaderc", "glfw/vulkan"]
# Assimp and GLFW built from source and linked in, instead of the
# system's shared libraries: for exported games, which must run where
# those are not installed. So is shaderc, Vulkan's shader compiler (the
# system's static shaderc lacks SPIRV-Tools, at least on Arch).
standalone = ["russimp-ng/static-link", "glfw/src-build", "shaderc?/build-from-source"]
