name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies (Linux)
      # libassimp-dev pulls in whichever libassimp runtime the image ships
      # (the versioned libassimp5 package no longer exists on ubuntu-latest)
      # and provides the libassimp.so link that russimp-sys-ng needs.
      # libclang-dev is required by bindgen and libssl-dev by reqwest in the
      # russimp-sys-ng build script; zlib1g-dev is linked alongside assimp.
      # glfw-sys has no prebuilt Linux libraries and builds GLFW from source,
      # which needs the X11 and Wayland headers.
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config libassimp-dev libclang-dev libssl-dev zlib1g-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev
      if: matrix.platform == 'ubuntu-latest'
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
